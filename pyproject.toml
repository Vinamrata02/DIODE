[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exact-linear-ode"
version = "0.1.0"
description = "Exact Linear ODE solvers and benchmark runners for gene regulatory network recovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "tqdm",
    "networkx",
]

[project.optional-dependencies]
matlab = [
    "matlabengine",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
exact-linear-ode-run = "exact_linear_ode.runners.run_dataset:main"
exact-linear-ode-run-all = "exact_linear_ode.runners.run_all:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diode"
version = "0.1.0"
description = "DIODE solvers and benchmark runners for gene regulatory network recovery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "torch",
    "scikit-learn",
    "scipy",
    "pyyaml",
    "tqdm",
    "networkx",
]

[project.optional-dependencies]
grnboost2 = [
    "arboreto==0.1.6",
    "dask[dataframe]>=2024.1.0",
    "distributed>=2024.1.0",
]
imputation = [
    "numpy<2; python_version < '3.12'",
    "scanpy",
    "natsort",
    "ipywidgets",
    "magic-impute==3.0.0; python_version < '3.12'",
    "future; python_version >= '3.12'",
    "tasklogger>=1; python_version >= '3.12'",
    "graphtools>=1.4; python_version >= '3.12'",
    "decorator>=4.3; python_version >= '3.12'",
    "geomloss",
    "torchdiffeq",
    "torchsde",
    "POT",
    "phate",
]
matlab = [
    "matlabengine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diode.utils" = ["run_slingshot.R"]

[project.scripts]
diode-run = "diode.runners.run_dataset:main"
diode-run-all = "diode.runners.run_all:main"
